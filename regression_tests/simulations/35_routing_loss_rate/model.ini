# Reach losses: loss_rate on routing nodes
#
# Two reaches in series, each losing water from inside its divisions:
#
#   reach_lag   lag = 2, no table (its one division holds nothing), loss_rate = 30
#   reach_pwl   n_divs = 3, PWL travel-time table, loss_rate = 10
#
# reach_lag is hand-checkable. With no table the division's storage is zero,
# so the loss bound is whatever arrives from the lag: loss = min(30, qin).
# Inflow is 100/step for 8 steps and the lag delays it two steps.
#
#   step  qin from lag   loss   dsflow
#   0, 1        0           0       0     dry reach: nothing to lose
#   2..7      100          30      70
#
#   usflow 800, loss 180, dsflow 420, 200 still in transit in the lag.
#   mbal = (dsflow - usflow) / 8 = (420 - 800) / 8 = -47.5
#        = -(200 stored + 180 lost) / 8
#   The loss reaches mbal through the smaller dsflow, exactly as a loss
#   node's does; nothing is booked twice.
#
# reach_pwl's rows are engine-derived (a PWL solve is not hand arithmetic).
# Its closure - usflow - loss - dsflow = change in volume - is pinned by the
# unit tests in src/tests/test_routing_loss_rate.rs on the same configuration.

[kalix]
start = 2024-01-01
end = 2024-01-08

[node.inflow1]
loc = 0, 0
type = inflow
inflow = 100
ds_1 = reach_lag

[node.reach_lag]
loc = 0, 30
type = routing
lag = 2
loss_rate = 30
ds_1 = reach_pwl

[node.reach_pwl]
loc = 0, 60
type = routing
n_divs = 3
x = 0.2
pwl = Flow [ML], Travel Time [steps],
      0,    2,
      100,  1,
      1000, 0.5,
loss_rate = 10
ds_1 = bh1

[node.bh1]
loc = 0, 90
type = blackhole

[outputs]
node.reach_lag.usflow
node.reach_lag.loss
node.reach_lag.dsflow
node.reach_pwl.usflow
node.reach_pwl.loss
node.reach_pwl.dsflow
node.reach_pwl.volume
