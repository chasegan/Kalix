site_name: Kalix
site_description: >-
  Kalix — an open-source hydrological and river-management modelling platform.
site_url: https://kalixproject.org/
site_author: Kalix Project

repo_url: https://github.com/chasegan/Kalix
repo_name: chasegan/Kalix
edit_uri: ""

copyright: © 2026 Kalix Project · MPL 2.0

docs_dir: docs
site_dir: site

# Promote link problems to warnings so `mkdocs build --strict` fails on any
# broken internal link — a standing guard against link rot as pages move.
validation:
  links:
    unrecognized_links: warn
    absolute_links: warn

# `mkdocs serve` also watches these (they live outside docs_dir): the per-release
# files the Downloads page is built from, and the macros module.
watch:
  - data
  - main.py

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/wordmark.png
  favicon: assets/favicon.svg  # adaptive (dark glyph on light tabs, light on dark)
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light mode only — no dark variant (tokens.css drives the palette).
    scheme: default
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    # navigation.tabs scopes the left sidebar to the current top-level section
    # (Docs shows only Docs, Tutorials only Tutorials). The custom header
    # (overrides/main.html) blanks the visual tabs row, so only the scoping
    # behaviour is used, not the tabs bar.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros:
      module_name: main
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      title: Page contents   # right-hand sidebar heading (Material reads this)
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.keys

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/cf-email.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chasegan/Kalix
      name: Kalix on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kalix/
      name: Kalix on PyPI

# Kept in the source tree but excluded from the built site (owner decision:
# rough research/internal notes that shouldn't publish yet).
nav:
  # Home is the bespoke pass-through landing page (docs/index.html), served at the
  # site root and bypassing the Material theme — so it is not listed here.
  - Tutorials:
      - tutorials/index.md
      - The fundamentals:
          - 01 · Your first model: tutorials/01-first-model.md
          - 02 · Expressions: tutorials/02-expressions.md
          - 03 · Relative & trailhead paths: tutorials/03-paths.md
          - 04 · Running from the commandline: tutorials/04-commandline.md
          - 05 · Running from Python: tutorials/05-python.md
      - Calibration & analysis:
          - 12 · Optimisation from the commandline: tutorials/12-optimisation-cli.md
          - 13 · Optimisation from Python: tutorials/13-optimisation-python.md
  - Docs:
      - docs/index.md
      - About Kalix: docs/about-kalix.md
      - Components:
          - docs/index.md   # make the 'Components' header link back to the Docs page
          - "[kalix]": docs/model-file-structure.md
          - "[inputs]": docs/input-data.md
          - "[constants]": docs/constants.md
          - "[node.*]":
              - docs/nodes.md
              - Blackhole: docs/blackhole.md
              - Confluence: docs/confluence.md
              - Gauge: docs/gauge.md
              - GR4J: docs/gr4j.md
              - Inflow: docs/inflow.md
              - Loss: docs/loss.md
              - Order control: docs/order-control.md
              - Regulated user: docs/regulated-user.md
              - Routing: docs/routing.md
              - Sacramento: docs/sacramento.md
              - Splitter: docs/splitter.md
              - Storage:
                  - docs/storage.md
                  - Storage tables: docs/storage-tables.md
              - Unregulated user: docs/unregulated-user.md
          - "[table.*]": docs/tables.md
          - "[outputs]": docs/model-outputs.md
      - KalixIDE: docs/ide.md
      - Kalix CLI: docs/cli.md
      - Kalix in Python: docs/python.md
      - Deep topics:
          - Conventions: docs/conventions.md
          - Data cache: docs/data-cache.md
          - Dynamic expressions:
              - docs/dynamic-expressions.md
              - Referencing input data: docs/referencing-input-data.md
              - Referencing model results: docs/referencing-model-results.md
              - Simulation context variables: docs/simulation-context-vars.md
          - Kalix binary path in KalixIDE: docs/kalix-binary-path.md
          - Optimisation:
              - docs/optimisation.md
              - Objective functions: docs/objective-functions.md
              - Algorithms:
                  - Shuffled Complex Evolution (SCE): docs/sce.md
                  - CMA-ES: docs/cma-es.md
                  - Differential Evolution: docs/differential-evolution.md
                  - DREAM: docs/dream.md
          - Ordering: docs/ordering.md
          - Parameter types: docs/parameter-types.md
          - Rainfall-runoff models:
              - GR4J: docs/gr4j-technical.md
              - Sacramento: docs/sacramento-technical.md
          - Run Manager: docs/run-manager.md
          - Running notebooks with uv: docs/notebooks-uv.md
      - Glossary: docs/glossary.md
  - Downloads: downloads.md
  - Code:
      - code/index.md
      - Start developing: code/start-developing.md
      - Platform design:
          - Manifesto: code/design/manifesto.md
          - The dev stack: code/design/dev-stack.md
          - ADRs: code/design/adrs.md
          - Website:
              - code/design/website/index.md
              - Todo: code/design/website/todo.md
  # Contact (docs/contact.md) runs inside the Material theme but hides both
  # sidebars via its front matter, so it is deliberately kept out of the nav —
  # the custom header already links to it.
