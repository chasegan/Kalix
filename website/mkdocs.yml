site_name: Kalix
site_description: >-
  Kalix — an open-source hydrological and river-management modelling platform.
site_url: https://kalixproject.org/
site_author: Kalix Project

repo_url: https://github.com/chasegan/Kalix
repo_name: chasegan/Kalix
edit_uri: ""

copyright: © 2026 Kalix Project · MPL 2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/wordmark.png
  favicon: assets/favicon.svg  # adaptive (dark glyph on light tabs, light on dark)
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light mode only — no dark variant (tokens.css drives the palette).
    scheme: default
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    # navigation.tabs scopes the left sidebar to the current top-level section
    # (Docs shows only Docs, Tutorials only Tutorials). The custom header
    # (overrides/main.html) blanks the visual tabs row, so only the scoping
    # behaviour is used, not the tabs bar.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros:
      module_name: main
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      title: Page contents   # right-hand sidebar heading (Material reads this)
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.keys

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chasegan/Kalix
      name: Kalix on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kalix/
      name: Kalix on PyPI

# Kept in the source tree but excluded from the built site (owner decision:
# rough research/internal notes that shouldn't publish yet).
exclude_docs: |
  optimisation/algorithms/sc-sahel.md
  optimisation/reparameterizations.md
  developing/gory-details/python-api-brainstorm.md

