# Dead storage on routing nodes
#
# Two reaches in series. reach_pool is lag-only with dead_storage = 100 and a
# loss series; reach_pwl has three divisions, a travel-time table and
# dead_storage = 30 (10 per division).
#
# reach_pool is hand-checkable. With no table its law is the pool alone, so
# the reach passes nothing until it holds 100 and everything above 100
# afterwards. It starts full.
#
#   day  inflow  loss  present  regime            volume  dsflow
#    1      0     30     100    routing: no live  ->  70     0   loss drives outflow to 0
#                                water, pool drains         (bound 0, then 30 from pool)
#    2      0     30      70    filling: pool drains  40     0
#    3      0     30      40    filling: pool drains  10     0
#    4     50      0      60    filling               60     0
#    5     50      0     110    routing: 10 live      100    10
#    6..8  50      0     150    routing: 50 live      100    50
#
#   in 250, loss 90, out 160, volume 100 -> 100: 250 - 90 - 160 - 0 = 0.
#   mbal = (dsflow - usflow) / 8 = (160 - 250) / 8 = -11.25. The pool's
#   initial 100 sits outside the balance, like a storage's initial_volume.
#
# reach_pwl's rows are engine-derived; the unit tests pin closure and the
# never-below-dead-level property on the same configuration.

[kalix]
start = 2024-01-01
end = 2024-01-08

[data]
input.csv

[node.inflow1]
loc = 0, 0
type = inflow
inflow = data.input_csv.by_name.inflow
ds_1 = reach_pool

[node.reach_pool]
loc = 0, 30
type = routing
dead_storage = 100
loss_rate = data.input_csv.by_name.loss
ds_1 = reach_pwl

[node.reach_pwl]
loc = 0, 60
type = routing
n_divs = 3
x = 0.2
dead_storage = 30
pwl = Flow [ML], Travel Time [steps],
      0,    2,
      100,  1,
      1000, 0.5,
ds_1 = bh1

[node.bh1]
loc = 0, 90
type = blackhole

[outputs]
node.reach_pool.usflow
node.reach_pool.loss
node.reach_pool.dsflow
node.reach_pool.volume
node.reach_pwl.usflow
node.reach_pwl.dsflow
node.reach_pwl.volume
