# Reach losses on routing nodes: evap + loss_table
#
# Seven independent branches (inflow -> reach -> blackhole), all fed the same
# inflow and evap. The first four share one loss table and cover the four
# solver cases:
#
#   reach_nlm_x1   NLM, x = 1,   one division
#   reach_nlm      NLM, x = 0.3, three divisions
#   reach_pwl_x1   PWL, x = 1,   one division
#   reach_pwl      PWL, x = 0.3, three divisions
#
# Two more cover other configurations:
#
#   reach_no_pool   reach_pwl_x1 with no dead storage: area at zero flow
#                   (rows 0,0,0 then 0,0,1) but nothing held, so no loss while dry
#   reach_lag_only  lag = 2 and no travel-time table, with the shared loss table
#
# reach_plain is reach_pwl without evap and loss_table: the control.
#
# The inflow has a dry start (the dead pool drains by evaporation), a low
# flow that refills it, a flood above both the travel-time table and the loss
# table, a recession, a second dry spell and a steady flow. The loss table
# has breakpoints inside the travel-time table's segments.
#
# Each reach starts with its dead pool (150 ML) full. That water sits outside
# the mass balance, like a storage's initial_volume. A routing node's mbal is
# (dsflow - usflow) / steps, so it carries the loss and the change in volume.
# All rows are engine-derived; closure is pinned by the unit tests in
# src/tests/test_node_routing_reach_losses.rs.

[kalix]
start = 2024-01-01
end = 2024-02-29

[data]
input.csv

[node.in_reach_nlm_x1]
loc = 0, 0
type = inflow
inflow = data.input_csv.by_name.inflow
ds_1 = reach_nlm_x1

[node.reach_nlm_x1]
loc = 0, 30
type = routing
n_divs = 1
x = 1
nlm = 30000, 0.8
evap = data.input_csv.by_name.evap
loss_table = Flow [ML], Dead storage [ML], Area [km2],
             0,   0,   0,
             0,   130, 0.8,
             0,   150, 1.0,
             50,  150, 1.5,
             200, 150, 2.2,
             600, 150, 2.6,
ds_1 = bh_reach_nlm_x1

[node.bh_reach_nlm_x1]
