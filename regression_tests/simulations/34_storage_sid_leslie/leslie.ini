# Storage inflow derivation (SID) on Leslie Dam, 1889-2025
#
# The original, unforced run of this model produced a level series. That series
# is fed back in as forced_level, and the inflow is deleted in every even
# calendar year. If forcing works, the forced run must reproduce the original
# exactly, and adjustment_volume must equal the deleted inflow in even years
# and vanish in odd ones. Real dam: MOLs on both outlets, three ordering
# users, spill above 472.64 m, daily rain and evaporation.
#
# pseudo_observed_level.csv.zip has deliberate gaps (see make_gaps.py, which lists
# them): the first and last two years, three-month, one-week and single-day
# gaps in both parities, one gap straddling an odd->even year boundary, a week
# over the record's highest spill, and three ALTERNATING runs
# (value, blank, value, blank, ...) in which every forced day is a first forced
# day, so sid_flux must be NaN right through them. A NaN level (a blank field
# in make_gaps.py's output, written as NaN by kalix convert) = not forced.
#
# inflow_1 at the bottom of the system is unphysical: it emits
# infill(sid_flux, 0). It exists so the mass balance is sensitive to the sid_flux
# filter - TOTAL carries mean(sid_flux, NaN->0) as its own term.
#
# Verified against the unforced original (same binary, inflow undeleted,
# forced_level removed), 49,854 daily steps:
#
#   interior forced days      level identical (0), all three diversions
#                             identical over the whole run
#   even years, interior      adjustment == deleted inflow to 6e-9 ML
#   odd years, interior       |adjustment| < 8e-9 ML
#   odd-year gaps             unforced solve stays on the original to 6e-14 m
#                             (707 days entered from a forced state)
#   even-year gaps            storage falls up to 2.34 m below the original,
#                             never above; the re-engage day snaps it back
#                             with one adjustment on which sid_flux is NaN
#   alternating runs          sid_flux NaN on every day; adjustment_volume
#                             reported on the forced days, 0 on the blanks
#   sid_flux NaN count        == blank days + re-engage days (1784 + 32)
#   mass balance              TOTAL_forced - TOTAL_original
#                             == mean(adjustment) + d(mean dam release)
#                                - d(mean diversions) + mean(sid_flux, NaN->0)
#                             to 1e-6 ML/step. The release term is spill the
#                             drained storage did not make in even-year gaps.
#
# A re-engage adjustment after a long even-year gap is much smaller than the
# inflow deleted during it (1891-01-01: 26,805 ML against 113,317 ML deleted in
# 1890) because most of that inflow would have spilled: a storage-based
# derivation recovers what changed storage, not what passed through.
#
# To regenerate the fixture: run this model with the inflow undeleted and no
# forced_level, take the storage's level column as pseudo_observed_level_full.csv,
# then `python make_gaps.py pseudo_observed_level_full.csv` and
# `kalix convert pseudo_observed_level.csv pseudo_observed_level.csv.zip`.
# The data/ files are the source CSVs cut to the columns this model reads,
# then converted the same way.

[kalix]
start = 1889-01-01
end = 2025-06-30

[data]
climate = ./data/climate.csv.zip
flow = ./data/flow.csv.zip
patterns = ./data/patterns.csv.zip
observed_level = pseudo_observed_level.csv.zip

[node.0202_UC_Reach_3_Sandy_Ck_inflow_at_Leslie_Dam]
