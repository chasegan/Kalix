[package]
name = "kalix"
version = "0.3.6"
edition = "2021"

# Keep the published crate / sdist lean. Without this, `cargo package` (and the
# maturin sdist, which vendors this crate as a path dependency of python/) sweeps
# in the whole repo tree — ~90 MB of committed test outputs under
# src/tests/example_data, plus regression_tests/ and examples/ data — pushing the
# sdist over PyPI's 100 MB per-file limit. None of it is needed to build the crate
# (only src/**/*.rs + build.rs + VERSION are), so exclude the heavy non-source
# trees. Excludes affect packaging only; local builds and tests still see everything.
exclude = [
    "/.github",
    "/benchmarks",
    "/docs",
    "/examples",
    "/graphics",
    "/kalixide",
    "/regression_tests",
    "/utils_for_troubleshooting",
    "/website",
    "src/tests/example_data",
    "src/tests/example_models",
]

[lib]
crate-type = ["lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libm = "0.2.2"
serde = "1.0.143"
csv = "1"
rand = "0.8.5"
rayon = "1.10"
tsz = "0.1.4"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "1.0"
base64 = "0.22"
rustc-hash = "2.0"
indexmap = "2.0"

[dependencies.uuid]
version = "1.1.2"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[dev-dependencies]
approx = "0.5"

# Release-profile tuning, per manifestos/performance.md §1: take the fast
# configuration by default. LTO + single codegen unit let the optimiser inline
# across crate boundaries (measured on the speed suite - see
# regression_tests/speed/speed_log.txt). Do NOT add `panic = "abort"`:
# simulation error reporting relies on catch_unwind (src/model.rs).
[profile.release]
lto = "thin"
codegen-units = 1
