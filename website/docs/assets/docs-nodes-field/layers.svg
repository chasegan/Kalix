<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a232b">
  <style>
    .soil { fill:#e8d9bd; stroke:#1a232b; stroke-width:1.2; }
    .bucket { fill:#d7e8c6; stroke:#2f6b4f; stroke-width:1.6; }
    .water { fill:#bcd6e8; }
    .lbl { font-size:15px; }
    .small { font-size:13px; fill:#52606b; }
    .mono { font-family: IBM Plex Mono, Menlo, Consolas, monospace; font-size:12.5px; }
    .axis { stroke:#cdd6de; stroke-width:1; }
    .root { stroke:#6b4a2b; stroke-width:1.4; fill:none; stroke-linecap:round; }
  </style>

  <text x="40" y="30" class="lbl" font-weight="600">One set of layers for the whole field</text>

  <!-- depth axis -->
  <text x="40" y="78" class="small">depth, mm</text>
  <line class="axis" x1="110" y1="90" x2="640" y2="90"/>
  <text x="100" y="94" text-anchor="end" class="small">0</text>
  <line class="axis" x1="110" y1="210" x2="640" y2="210"/>
  <text x="100" y="214" text-anchor="end" class="small">600</text>
  <line class="axis" x1="110" y1="270" x2="640" y2="270"/>
  <text x="100" y="274" text-anchor="end" class="small">900</text>
  <line class="axis" x1="110" y1="330" x2="640" y2="330"/>
  <text x="100" y="334" text-anchor="end" class="small">1200</text>

  <!-- fallow: bare, 600 mm -->
  <text x="190" y="80" text-anchor="middle" class="lbl">fallow</text>
  <rect x="130" y="90" width="120" height="120" class="bucket"/>
  <rect x="131" y="150" width="118" height="59" class="water"/>
  <rect x="131" y="91" width="118" height="14" fill="#efe0bf"/>
  <rect x="130" y="210" width="120" height="60" class="soil"/>
  <rect x="131" y="226" width="118" height="43" class="water"/>
  <rect x="130" y="270" width="120" height="60" class="soil"/>
  <rect x="131" y="300" width="118" height="29" class="water"/>
  <text x="190" y="352" text-anchor="middle" class="mono">root_depth = 600</text>

  <!-- cotton: 900 mm -->
  <text x="370" y="80" text-anchor="middle" class="lbl">cotton</text>
  <rect x="310" y="90" width="120" height="180" class="bucket"/>
  <rect x="311" y="190" width="118" height="79" class="water"/>
  <rect x="311" y="91" width="118" height="14" fill="#efe0bf"/>
  <rect x="310" y="270" width="120" height="60" class="soil"/>
  <rect x="311" y="282" width="118" height="47" class="water"/>
  <path class="root" d="M370,90 L370,262"/>
  <path class="root" d="M370,100 C352,140 336,190 332,250"/>
  <path class="root" d="M370,100 C388,140 404,190 408,252"/>
  <path class="root" d="M370,130 C350,150 326,170 324,200"/>
  <path class="root" d="M370,130 C390,150 414,170 416,202"/>
  <path class="root" d="M370,180 C358,210 352,235 350,258"/>
  <path class="root" d="M370,180 C382,210 388,235 390,258"/>
  <text x="370" y="352" text-anchor="middle" class="mono">root_depth = 900</text>

  <!-- lucerne: 1200 mm -->
  <text x="550" y="80" text-anchor="middle" class="lbl">lucerne</text>
  <rect x="490" y="90" width="120" height="240" class="bucket"/>
  <rect x="491" y="230" width="118" height="99" class="water"/>
  <rect x="491" y="91" width="118" height="14" fill="#efe0bf"/>
  <path class="root" d="M550,90 L550,322"/>
  <path class="root" d="M550,100 C530,160 512,230 508,310"/>
  <path class="root" d="M550,100 C570,160 588,230 592,312"/>
  <path class="root" d="M550,140 C528,170 504,200 502,240"/>
  <path class="root" d="M550,140 C572,170 596,200 598,242"/>
  <path class="root" d="M550,220 C536,260 528,290 526,318"/>
  <path class="root" d="M550,220 C564,260 572,290 574,318"/>
  <text x="550" y="352" text-anchor="middle" class="mono">root_depth = 1200</text>

  <!-- key -->
  <rect x="670" y="96" width="16" height="16" class="bucket"/>
  <text x="694" y="109" class="small">depletion, the empty part of a bucket</text>
  <rect x="670" y="122" width="16" height="16" fill="#efe0bf" stroke="#c9a96a" stroke-width="1"/>
  <text x="694" y="135" class="small">evaporation layer</text>
  <rect x="670" y="148" width="16" height="16" class="soil"/>
  <text x="694" y="161" class="small">layer below the roots</text>
  <rect x="670" y="174" width="16" height="16" class="water"/>
  <text x="694" y="187" class="small">water held</text>
  <text x="670" y="222" class="small">The layer boundaries are the field's</text>
  <text x="670" y="238" class="small">distinct root depths, fallow included.</text>
  <text x="670" y="262" class="small">A bucket is the green-edged box, from</text>
  <text x="670" y="278" class="small">the surface to the roots' depth. Each</text>
  <text x="670" y="294" class="small">partition has one, which the plants and</text>
  <text x="670" y="310" class="small">the irrigator work, and one depletion</text>
  <text x="670" y="326" class="small">per layer below it.</text>
  <text x="670" y="350" class="small">Below 1200 mm nothing on this field</text>
  <text x="670" y="366" class="small">draws: water that passes is gone.</text>
</svg>
