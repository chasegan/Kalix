# KalixIDE logging: SLF4J over java.util.logging (slf4j-jdk14). Installed by
# com.kalix.ide.logging.Logging at startup. The formatter names the logging thread, so the
# handler must publish synchronously, as ConsoleHandler does. Levels in java.util.logging
# terms: SEVERE = error, WARNING = warn, INFO = info, FINE = debug, FINEST = trace.

handlers = java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = com.kalix.ide.logging.LogLineFormatter

.level = INFO

# Debug for the parts under active development.
com.kalix.ide.interaction.level = FINE
com.kalix.ide.cli.level = FINE
com.kalix.ide.managers.FileWatcherManager.level = FINE

# Quieter libraries.
com.formdev.flatlaf.level = WARNING
org.fife.ui.level = WARNING
