name: Deploy website

# Builds the MkDocs site in website/ and deploys it to GitHub Pages.
#
# All content is committed Markdown. CI only regenerates the version-dependent
# data (project-health and speed plot from the committed regression data) and
# builds. Releases come from the committed data/releases/*.md files.
#
# Build dependencies come from website/requirements.lock, every version pinned,
# so a deploy builds with the same packages as the last one until someone
# changes the lock. requirements.txt holds the intent; the lock is compiled from
# it (see website/README.md). Per ADR-0011 §1.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "regression_tests/simulations/verify_all_models_log.txt"
      - "regression_tests/speed/speed_results.csv"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.lock

      - name: Install dependencies
        run: pip install -r website/requirements.lock

      - name: Generate version-dependent data
        working-directory: website
        run: |
          python scripts/gen_health.py
          python scripts/gen_speed_plot.py
          python scripts/gen_corpus.py

      - name: Build site
        working-directory: website
        run: mkdocs build --strict

      - name: Check internal links
        working-directory: website
        run: python scripts/check_links.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
