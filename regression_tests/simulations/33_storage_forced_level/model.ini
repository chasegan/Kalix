# Storage with a forced level (SID)
#
# Between them these steps pin:
#
#  (1) forcing engages and disengages on the NaN boundary, not on whether a
#      forced_level input was configured at all (steps 0-1 and 11 simulate
#      normally either side of the forced block);
#  (2) sid_flux is NaN on the FIRST step of a forced block (step 2) and
#      reported on the interior. That first step is a re-initialisation, not an
#      inflow, and reporting it would spike the head of every calibration;
#  (3) a level ABOVE the table top extrapolates as a simulated level does
#      (step 4).
#  (4) a level BELOW the table floor clamps to the floor (step 5);
#  (5) a storage that does not exist is not forced, whatever its forced_level
#      says (steps 7-8);
#  (6) the step after an absence is NOT the interior of a forced run (step 9),
#      so sid_flux is NaN there too.
#
# Hand-checked mass balance. Inflow is 50/step, area is 0 so net rain is
# irrelevant, and there are no orders, so nothing leaves except the drain when
# the storage stops existing.
#
#   step  forced   ->  volume   adjustment      note
#     0   NaN           50           0          simulating
#     1   NaN          100           0          simulating
#     2   2.0 m        200         +50          first forced step: sid NaN
#     3   2.0 m        200         -50          interior
#     4   9.9 m        990        +740          above table top: extrapolates
#     5  -5.0 m          0       -1040          below floor: clamps
#     6   2.0 m        200        +150          interior
#     7   absent         0           0          drains 200 + 50 = 250
#     8   absent         0           0          drains 0 + 50 = 50
#     9   2.0 m        200        +150          back after absence: sid NaN
#    10   2.0 m        200         -50          interior
#    11   NaN          250           0          simulating again
#
#   through-flow = 7*(0-50) + (250-50) + (50-50) + 3*(0-50)  = -300
#   adjustments  = 50 - 50 + 740 - 1040 + 150 + 150 - 50     =  -50
#   mbal         = -300 - (-50)                              = -250
#   per timestep = -250 / 12                                 = -20.8333...
#
# TOTAL is non-zero and should be: water is still stored at the end and the
# forcing adjustment nets out non-zero. A non-zero TOTAL is normal wherever
# water remains in storage (18_filling_emptying_storage is 4.6).

[kalix]
start = 2024-01-01
end = 2024-01-12

[data]
input.csv

[node.inflow1]
loc = 0, 0
type = inflow
inflow = 50
ds_1 = forced_storage

[node.forced_storage]
loc = 0, 30
type = storage
dimensions = Level [m], Volume [ML], Area [km2], Spill [ML],
             0        , 0          , 0.0       , 0,
             2        , 200        , 0.0       , 0,
             4        , 400        , 0.0       , 0,
forced_level = data.input_csv.by_name.fl
exists = data.input_csv.by_name.exists
ds_1 = bh1

[node.bh1]
loc = 0, 60
type = blackhole

[outputs]
node.forced_storage.volume
node.forced_storage.level
node.forced_storage.forced_level
node.forced_storage.adjustment_volume
node.forced_storage.sid_flux
