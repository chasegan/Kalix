# Exercises `exists` on a storage that also uses `target_level`, behind a lagged
# upstream supply. `exists` must not alter the order phase: `order_through` is
# fixed when the ordering solution is built (it sizes the order buffers), so a
# storage cannot switch between supplying and ordering-through mid-run. The
# target-level order buffer must therefore keep advancing while the storage
# does not exist, or orders placed beforehand stay "en route" forever and the
# storage under-orders once it returns.

[kalix]

[inputs]
exist = data_storage_exists.csv
inflow = data_inflow.csv
demand = data_demand.csv

[node.inflow]
loc = 0, 0
type = inflow
inflow = data.inflow.by_index.1
ds_1 = supply

[node.supply]
loc = 0, 50
type = storage
initial_volume = 1500
dimensions = Level [m], Volume [ML], Area [km2], Spill [ML],
             0        , 0          , 0         , 0,
             10       , 2000       , 0         , 0,
             11       , 2100       , 0         , 1000,
ds_1 = reach

[node.reach]
loc = 0, 75
type = routing
lag = 3
ds_1 = target

[node.target]
loc = 0, 100
type = storage
initial_volume = 200
target_level = 5.0
exists = data.exist.by_index.1
dimensions = Level [m], Volume [ML], Area [km2], Spill [ML],
             0        , 0          , 0         , 0,
             10       , 2000       , 0         , 0,
             11       , 2100       , 0         , 1000,
ds_1 = user

[node.user]
type = regulated_user
loc = 0, 200
order = data.demand.by_index.1
ds_1 = blackhole

[node.blackhole]
type = blackhole
loc = 0, 250

[outputs]
node.target.volume
node.target.exists
node.user.diversion
