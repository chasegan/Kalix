[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "kalix"
version = "0.3.6"
description = "Python interface for Kalix: hydrological modelling and Pixie (Gorilla-compressed) timeseries I/O"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
authors = [{ name = "Kalix contributors" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://kalixproject.org"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "kalix._native"
features = ["pyo3/extension-module"]
strip = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "tox>=4.30.3",
]

[tool.pylint.master]
# kalix._native is a compiled PyO3 extension; astroid can't statically parse
# it, so pylint must actually import it to see its members (else every name
# in it is flagged as no-name-in-module).
extension-pkg-allow-list = ["kalix._native"]
