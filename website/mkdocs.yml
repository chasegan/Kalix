      - Concepts:
          - Model file structure: concepts/model-file-structure.md
          - Conventions: concepts/conventions.md
          - Ordering: concepts/ordering.md
          - Dynamic expressions:
              - concepts/dynamic-expressions/index.md
              - Referencing input data: concepts/dynamic-expressions/referencing-input-data.md
              - Referencing model results: concepts/dynamic-expressions/referencing-model-results.md
              - Simulation context variables: concepts/dynamic-expressions/simulation-context-vars.md
              - Constants: concepts/dynamic-expressions/constants.md
          - Parameter types: concepts/parameter-types.md
          - Data cache: concepts/data-cache.md
          - Input data: concepts/input-data.md
          - Model outputs: concepts/model-outputs.md
      - Nodes:
          - nodes/index.md
          - Inflow: nodes/inflow.md
          - GR4J: nodes/gr4j.md
          - Sacramento: nodes/sacramento.md
          - Storage: nodes/storage.md
          - Storage tables: nodes/storage-tables.md
          - Routing: nodes/routing.md
          - Confluence: nodes/confluence.md
          - Splitter: nodes/splitter.md
          - Loss: nodes/loss.md
          - Gauge: nodes/gauge.md
          - Regulated user: nodes/regulated-user.md
          - Unregulated user: nodes/unregulated-user.md
          - Order control: nodes/order-control.md
          - Blackhole: nodes/blackhole.md
      - Using Kalix:
          - KalixIDE: using/ide.md
          - Kalix CLI: using/cli.md
          - Kalix in Python: using/python.md
