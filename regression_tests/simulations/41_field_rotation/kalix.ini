[kalix]
# Regression model 41: a cotton and wheat rotation on one field.
#
# A 30 km2 catchment, a Sacramento model with a parameter set borrowed from
# model 9, runs off into a 2,000 ML farm storage: 300 to 1,850 ML a year in
# this climate, most of it in the two wet years. The storage supplies a
# 110 ha field through an outlet of 4.5 ML a day. Cotton is planted each
# 15 October on a hectare for every 10 ML in store, so the area follows the
# dam (110, 58, 110, 110 and 103 ha over the five years), and is harvested
# 195 days on; wheat is sown over the whole field on 15 May once the cotton
# is off, and comes off before the next cotton goes in. Each crop orders to
# a refill target and is abandoned the day after its stress coefficient
# falls below a threshold (0.6 for cotton, 0.3 for wheat): with the outlet
# as it is, that happens to the cotton in three of the five summers (March
# 1991, February 1993 and March 1994) and never to the wheat. Crop
# coefficients, stage lengths, root depths and depletion fractions are
# FAO-56 Tables 11, 12 and 22. Five July-to-June years of the synthetic
# climate shared with model 39.
start = 1990-07-01
end = 1995-06-30

[data]
climate.csv

# Cotton: FAO-56 Table 11 (Egypt, Pakistan, California) 30/50/60/55 days, 195
# in all; Table 12 Kc ini 0.35, mid 1.15, end 0.60; Table 22 root depth
# 1.0 to 1.7 m, p 0.65.
[crop.cotton]
root_depth = 1200
p = 0.65
kc = Day, Kc,
     0,   0.35,
     30,  0.35,
     80,  1.15,
     140, 1.15,
     195, 0.60,
season_len = 195

# Wheat sown in winter, as in Australia: FAO-56 Table 11 spring wheat
# 20/30/60/40 days, 150 in all; Table 12 Kc ini 0.30, mid 1.15, end 0.30;
# Table 22 root depth 1.0 to 1.5 m, p 0.55.
[crop.wheat]
root_depth = 1200
p = 0.55
kc = Day, Kc,
     0,   0.30,
     20,  0.30,
     50,  1.15,
     110, 1.15,
     150, 0.30,
season_len = 150

[crop.bare_soil]
root_depth = 600
kc = 0.4

[node.creek]
type = sacramento
loc = -1.20, -78.92
area = 30
rain = data.climate_csv.by_name.rain
evap = data.climate_csv.by_name.et0
params = 0.000367, 226.5, 72.82, 0.04604, 0.002890, 18.94, 0.0000172, 0.2962, 2.936, 0.007271, 0.0000121, 0.07579, 87.19, 0.1631, 19.63, 3.232, 0.9127
ds_1 = dam

[node.dam]
type = storage
loc = 4.92, -38.78
initial_volume = 1200
dimensions = Level [m], Volume [ML], Area [km2], Spill [ML],
             0.0      , 0.0        , 0.0       , 0.0,
             2.0      , 1000.0     , 0.1       , 0.0,
             4.0      , 2000.0     , 0.1       , 0.0,
             4.1      , 2050.0     , 0.1       , 1.0E9,
ds_1_outlet = 0, 4.5
ds_1 = paddock

[node.paddock]
type = field
loc = 4.20, 8.24
area = 1.1
available_water = 150
rain = data.climate_csv.by_name.rain
evap = data.climate_csv.by_name.et0
efficiency = 0.8
fallow = bare_soil
crop_1 = cotton
crop_1_plant = if(sim.month == 10 && sim.day == 15, min(this.area, 0.01 * node.dam.volume[-1, 0] / 10.0), 0)
crop_1_order = this.crop_1_area * clamp(this.crop_1_depletion[-1, 0] - 50, 0, 120)
crop_1_viable_area = if(this.crop_1_ks < 0.6, 0, this.area)
crop_2 = wheat
crop_2_plant = if(sim.month == 5 && sim.day == 15, this.area, 0)
crop_2_order = this.crop_2_area * clamp(this.crop_2_depletion[-1, 0] - 40, 0, 120)
crop_2_viable_area = if(this.crop_2_ks < 0.3, 0, this.area)
ds_1 = sink

[node.sink]
type = blackhole
loc = 0.38, 57.20

[outputs]
node.creek.dsflow
node.dam.ds_1
node.dam.volume
node.paddock.crop_1_area
node.paddock.crop_1_depletion
node.paddock.crop_1_ks
node.paddock.crop_1_plant
node.paddock.crop_1_order
node.paddock.crop_1_viable_area
node.paddock.crop_2_area
node.paddock.crop_2_depletion
node.paddock.crop_2_ks
node.paddock.crop_2_plant
node.paddock.crop_2_order
node.paddock.crop_2_viable_area
node.paddock.soil_moisture

node.paddock.ds_1
node.paddock.fallow_depletion
node.paddock.supply
node.paddock.excess
