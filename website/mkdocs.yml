site_name: Kalix
site_description: >-
  Kalix — an open-source hydrological and river-management modelling platform.
site_url: https://kalixproject.org/
site_author: Kalix Project

repo_url: https://github.com/chasegan/Kalix
repo_name: chasegan/Kalix
edit_uri: ""

copyright: © 2026 Kalix Project · MPL 2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/wordmark.png
  favicon: assets/favicon.svg  # adaptive (dark glyph on light tabs, light on dark)
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light mode only — no dark variant (tokens.css drives the palette).
    scheme: default
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    # navigation.tabs scopes the left sidebar to the current top-level section
    # (Docs shows only Docs, Tutorials only Tutorials). The custom header
    # (overrides/main.html) blanks the visual tabs row, so only the scoping
    # behaviour is used, not the tabs bar.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros:
      module_name: main
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      title: Page contents   # right-hand sidebar heading (Material reads this)
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.keys

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chasegan/Kalix
      name: Kalix on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kalix/
      name: Kalix on PyPI

# Kept in the source tree but excluded from the built site (owner decision:
# rough research/internal notes that shouldn't publish yet).
exclude_docs: |
  docs/optimisation/algorithms/sc-sahel.md
  docs/optimisation/reparameterizations.md
  code/developing/gory-details/python-api-brainstorm.md

nav:
  # Home is the bespoke pass-through landing page (docs/index.html), served at the
  # site root and bypassing the Material theme — so it is not listed here.
  - Tutorials:
      - tutorials/index.md
      - 01 · Your first model: tutorials/01-first-model.md
      - 02 · Expressions: tutorials/02-expressions.md
      - 03 · Relative & trailhead paths: tutorials/03-paths.md
      - 04 · Running from the commandline: tutorials/04-commandline.md
      - 05 · Running from Python: tutorials/05-python.md
      - 06 · Optimisation from the commandline: tutorials/06-optimisation-cli.md
      - 07 · Optimisation from Python: tutorials/07-optimisation-python.md
  - Docs:
      - docs/index.md
      - Getting started: docs/getting-started.md
      - Components:
          - "[kalix]": docs/concepts/model-file-structure.md
          - "[inputs]": docs/concepts/input-data.md
          - "[constants]": docs/concepts/dynamic-expressions/constants.md
          - "[node.*]":
              - docs/nodes/index.md
              - Blackhole: docs/nodes/blackhole.md
              - Confluence: docs/nodes/confluence.md
              - Gauge: docs/nodes/gauge.md
              - GR4J: docs/nodes/gr4j.md
              - Inflow: docs/nodes/inflow.md
              - Loss: docs/nodes/loss.md
              - Order control: docs/nodes/order-control.md
              - Regulated user: docs/nodes/regulated-user.md
              - Routing: docs/nodes/routing.md
              - Sacramento: docs/nodes/sacramento.md
              - Splitter: docs/nodes/splitter.md
              - Storage: docs/nodes/storage.md
              - Storage tables: docs/nodes/storage-tables.md
              - Unregulated user: docs/nodes/unregulated-user.md
          - "[outputs]": docs/concepts/model-outputs.md
      - Concepts:
          - Conventions: docs/concepts/conventions.md
          - Ordering: docs/concepts/ordering.md
          - Dynamic expressions:
              - docs/concepts/dynamic-expressions/index.md
              - Referencing input data: docs/concepts/dynamic-expressions/referencing-input-data.md
              - Referencing model results: docs/concepts/dynamic-expressions/referencing-model-results.md
              - Simulation context variables: docs/concepts/dynamic-expressions/simulation-context-vars.md
          - Parameter types: docs/concepts/parameter-types.md
          - Data cache: docs/concepts/data-cache.md
      - Using Kalix:
          - KalixIDE: docs/using/ide.md
          - Kalix CLI: docs/using/cli.md
          - Kalix in Python: docs/using/python.md
          - Run Manager: docs/using/run-manager.md
          - Kalix binary path in KalixIDE: docs/using/kalix-binary-path.md
          - Running notebooks with uv: docs/using/notebooks-uv.md
      - Optimisation:
          - docs/optimisation/index.md
          - Objective functions: docs/optimisation/objective-functions.md
          - Algorithms:
              - Shuffled Complex Evolution (SCE): docs/optimisation/algorithms/sce.md
              - CMA-ES: docs/optimisation/algorithms/cma-es.md
              - Differential Evolution: docs/optimisation/algorithms/differential-evolution.md
              - DREAM: docs/optimisation/algorithms/dream.md
      - Glossary:
          - docs/reference/glossary.md
      - Technical reference:
          - GR4J: docs/reference/technical/gr4j.md
          - Sacramento: docs/reference/technical/sacramento.md
  - Downloads: downloads.md
  - Code:
      - code.md
      - Developing:
          - Start developing: code/developing/start-developing.md
          - The dev stack: code/developing/dev-stack.md
          - Gory details:
              - code/developing/gory-details/index.md
              - Architecture Decision Records: code/developing/gory-details/adrs.md
  # Contact is a bespoke pass-through page (docs/contact/index.html) served at
  # /contact/, bypassing the Material theme — so it is not listed here.
