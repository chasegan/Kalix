[kalix]

[data]
climate.csv

[const]
const.t_lapse = -0.0065
const.dz = 300

[node.snow_only]
type = gr4jsg
loc = 0, 0
area = 165
rain = data.climate_csv.by_name.rain
evap = data.climate_csv.by_name.mpot
tmax = data.climate_csv.by_name.tmax
tmin = data.climate_csv.by_name.tmin
params = 320, -1.5, 75, 1.7
snow_params = 0.4, 0.5, 3.38, 1.3, 2.2

[node.lapsed]
type = gr4jsg
loc = 0, 5
area = 165
rain = 1.1 * data.climate_csv.by_name.rain
evap = max(0, data.climate_csv.by_name.mpot - 0.0005 * const.dz)
tmax = data.climate_csv.by_name.tmax + const.t_lapse * const.dz
tmin = data.climate_csv.by_name.tmin + const.t_lapse * const.dz
params = 320, -1.5, 75, 1.7
snow_params = 0.4, 0.5, 3.38, 1.3, 2.2

[node.glacier]
type = gr4jsg
loc = 0, 10
area = 42
rain = data.climate_csv.by_name.rain
evap = data.climate_csv.by_name.mpot
tmax = data.climate_csv.by_name.tmax
tmin = data.climate_csv.by_name.tmin
params = 320, -1.5, 75, 1.7
snow_params = 0.4, 0.5, 3.38, 1.3, 2.2
ice_params = 80000, 5, -0.5, 3.2, 2

[outputs]
node.snow_only.runoff_depth
node.snow_only.snow_store
node.snow_only.snowfall
node.snow_only.snow_melt
node.lapsed.runoff_depth
node.lapsed.snow_store
node.glacier.runoff_depth
node.glacier.snow_store
node.glacier.ice_store
node.glacier.ice_melt
