<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a232b">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6a97"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f7d88"/></marker>
    <marker id="arrow-vapour" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#96631a"/></marker>
  </defs>
  <style>
    .w { stroke:#2a6a97; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
    .wl { stroke:#2a6a97; stroke-width:2.2; fill:none; }
    .g { stroke:#6f7d88; stroke-width:2; fill:none; marker-end:url(#arrow-grey); stroke-dasharray:5 4; }
    .v { stroke:#96631a; stroke-width:2.2; fill:none; marker-end:url(#arrow-vapour); }
    .lbl { font-size:15px; }
    .small { font-size:13px; fill:#52606b; }
    .mono { font-family: IBM Plex Mono, Menlo, Consolas, monospace; font-size:12.5px; }
    .step { font-size:12px; fill:#ffffff; font-weight:600; }
  </style>

  <!-- surface -->
  <line x1="30" y1="262" x2="750" y2="262" stroke="#cdd6de" stroke-width="1.5"/>
  <text x="34" y="256" class="small">surface</text>

  <!-- rain: runoff is taken first, interception from what is left -->
  <text x="300" y="34" class="lbl" font-weight="600">rain</text>
  <path class="wl" d="M312,42 L312,252"/>
  <path class="w" d="M312,252 L312,254"/>
  <path class="w" d="M312,86 C312,120 420,100 500,140 L765,140"/>
  <text x="520" y="84" class="lbl">storm runoff</text>
  <text x="520" y="101" class="small">taken first, from the gross rain; only with a</text>
  <text x="520" y="117" class="small">curve_number, and by the bucket's wetness</text>
  <path class="v" d="M312,165 C335,165 345,150 370,146"/>
  <text x="378" y="152" class="lbl">intercepted</text>
  <text x="378" y="169" class="mono">min(rain − runoff, interception × evap)</text>
  <text x="230" y="215" class="small">what reaches</text>
  <text x="230" y="231" class="small">the soil</text>
  <circle cx="290" cy="245" r="9" fill="#2a6a97"/><text x="290" y="249" text-anchor="middle" class="step">4</text>

  <!-- irrigation -->
  <text x="30" y="300" class="lbl" font-weight="600">irrigation</text>
  <text x="30" y="318" class="small">up to the crop's order due,</text>
  <text x="30" y="334" class="small">or its share of water beyond</text>
  <text x="30" y="350" class="small">the orders; never more than</text>
  <text x="30" y="366" class="small">the bucket has room for</text>
  <path class="w" d="M42,376 L42,392 L236,392"/>
  <circle cx="110" cy="392" r="9" fill="#2a6a97"/><text x="110" y="396" text-anchor="middle" class="step">5</text>
  <path class="g" d="M170,392 C182,392 182,418 182,434"/>
  <text x="30" y="458" class="lbl">escape</text>
  <text x="30" y="475" class="mono">supply × (1 − efficiency)</text>
  <text x="30" y="492" class="small">leaves the model here</text>

  <!-- root bucket: green is the root zone, as in the other diagrams -->
  <rect x="240" y="268" width="320" height="160" fill="#d7e8c6" stroke="#2f6b4f" stroke-width="1.6"/>
  <rect x="241" y="316" width="318" height="111" fill="#bcd6e8"/>
  <line x1="241" y1="316" x2="559" y2="316" stroke="#2a6a97" stroke-width="1.5"/>
  <text x="250" y="288" class="lbl" font-weight="600">root bucket</text>
  <text x="352" y="288" class="small">holds TAW between full and empty</text>
  <text x="250" y="306" class="mono">TAW = available_water × root_depth / 1000</text>
  <text x="250" y="414" class="small">the plants and the irrigator work this</text>
  <path d="M568,270 L576,270 L576,314 L568,314" fill="none" stroke="#1a232b" stroke-width="1.2"/>
  <text x="584" y="282" class="lbl">depletion</text>
  <text x="584" y="299" class="small">0 when full,</text>
  <text x="584" y="314" class="small">TAW when empty</text>
  <path d="M568,318 L576,318 L576,426 L568,426" fill="none" stroke="#1a232b" stroke-width="1.2"/>
  <text x="584" y="376" class="lbl">water held</text>

  <!-- ET -->
  <path class="v" d="M470,268 L470,196"/>
  <text x="480" y="208" class="lbl">evapotranspiration</text>
  <text x="480" y="225" class="mono">ks × kc × evap</text>
  <text x="480" y="241" class="small">at most the water held</text>
  <circle cx="446" cy="248" r="10" fill="#96631a"/><text x="446" y="252" text-anchor="middle" class="step">2–3</text>

  <!-- layers below -->
  <rect x="240" y="444" width="320" height="42" fill="#e8d9bd" stroke="#1a232b" stroke-width="1.5"/>
  <rect x="241" y="462" width="318" height="23" fill="#bcd6e8"/>
  <text x="250" y="459" class="small">layer below the roots · its own depletion</text>
  <rect x="240" y="500" width="320" height="42" fill="#e8d9bd" stroke="#1a232b" stroke-width="1.5"/>
  <rect x="241" y="512" width="318" height="29" fill="#bcd6e8"/>
  <text x="250" y="515" class="small">next layer · its own depletion</text>
  <text x="240" y="568" class="small">below the deepest roots on the field, nothing draws</text>
  <path class="w" d="M360,428 L360,444"/>
  <path class="w" d="M360,486 L360,500"/>
  <text x="372" y="497" class="small">overflow fills each layer in turn</text>
  <path class="w" d="M560,521 L765,521"/>
  <text x="755" y="544" text-anchor="end" class="small">past the last layer</text>

  <!-- excess channel -->
  <rect x="768" y="130" width="122" height="410" fill="#e9f1f7" stroke="#bcd6e8" rx="6"/>
  <text x="829" y="158" text-anchor="middle" class="lbl" font-weight="600">excess</text>
  <text x="829" y="177" text-anchor="middle" class="small">all the rain the</text>
  <text x="829" y="193" text-anchor="middle" class="small">paddock sheds</text>
  <text x="829" y="482" text-anchor="middle" class="small">split by</text>
  <text x="829" y="500" text-anchor="middle" class="mono">return_fraction</text>
  <path class="w" d="M829,540 L829,566"/>
  <text x="829" y="586" text-anchor="middle" class="small">ds_1 river · ds_2 farm</text>
  <text x="240" y="590" class="small">the numbers are the steps of "How the node works"</text>
</svg>
